<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xpert</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; max-width: 420px; margin: 0 auto; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      p { margin: 0; color: #b4b4b4; font-size: 15px; line-height: 1.5; }
      button { align-self: flex-start; margin-top: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #fff; color: #000; font-size: 15px; font-weight: 500; }
    </style>
  </head>
  <body>
    <!--
      Shown by the native app when a page of the Xpert website doesn't load: no connection, the site
      is busy, or (Android) a full page load that returned an error. This page lives inside the app
      (https://localhost/ on Android, capacitor://localhost/ on iOS), so "Try again" opens the site's
      own address. Keep SITE in step with server.url in capacitor.config.ts.
    -->
    <main>
      <h1>Xpert didn't load</h1>
      <p>Check your Wi-Fi or mobile data, then try again. If you're online, the site may be busy for a moment.</p>
      <button type="button" onclick="location.replace(SITE)">Try again</button>
    </main>
    <script>
      var SITE = "https://fantasy-football-xi-ecru.vercel.app/";
    </script>
  </body>
</html>
